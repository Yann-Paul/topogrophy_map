<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Shaded Topo Map</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font:13px system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #eebox{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #ee{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:#fff;display:none}
  #ui{position:absolute;top:10px;left:10px;z-index:1;background:#fff;padding:10px 12px;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.3);display:grid;grid-template-columns:auto auto;gap:6px 10px;align-items:center}
  #ui input[type=number],#ui select{width:90px}
  #ui button{grid-column:1/3}
  #status{grid-column:1/3;color:#666;min-height:1em}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="ee"></canvas>
<canvas id="eebox"></canvas>
<div id="ui">
  <label>Projektion</label>
  <select id="proj"><option value="globe">Globus</option><option value="mercator" selected>Mercator</option><option value="ee">Equal Earth (flächentreu)</option><option value="eew">Equal Earth Weltkarte</option><option value="rob">Robinson</option><option value="robw">Robinson Weltkarte</option><option value="laea">Lambert-Azimutal (flächentreu)</option></select>
  <label>Mittelmeridian°</label><input id="lon0" type="number" min="-180" max="180" step="1" placeholder="Ausschnittsmitte" title="Equal Earth: fester Mittelmeridian. 0 = Ausschnitt der statischen Weltkarte (wie Weltkarten-Modus). Leer = Mitte des Ausschnitts">
  <label>Mittelbreite°</label><input id="lat0" type="number" min="-90" max="90" step="1" placeholder="Ausschnittsmitte" title="Lambert-Azimutal: Breite des Kartenmittelpunkts (Europa/ETRS89-LAEA: 52). Leer = Mitte des Ausschnitts">
  <label>Basemap</label>
  <select id="base">
    <option value="sat">Satellit (Esri)</option>
    <option value="topo">Topographisch (Esri)</option>
    <option value="osm">OpenStreetMap</option>
    <option value="none">Nur Relief</option>
  </select>
  <label>Z-Faktor</label><input id="zf" type="number" value="8" min="0.1" step="1">
  <label>Sonne Azimut°</label><input id="az" type="number" value="315" min="0" max="360" step="15">
  <label>Sonne Höhe°</label><input id="alt" type="number" value="45" min="1" max="90" step="5">
  <label>Stärke</label><input id="str" type="range" value="0.33" min="0" max="1" step="0.01">
  <label title="Helle Seite der Berge. 0 = nur Schatten, matt. 0,6 = bisheriges Aussehen">Glanzlichter</label><input id="gl" type="range" value="0.1" min="0" max="1" step="0.05">
  <label title="Städte, Grenzen, Gipfel mit Höhe, Flüsse">Beschriftung</label>
  <select id="ref"><option value="">Aus</option><option value="#fff">Schrift weiß</option><option value="#000" selected>Schrift schwarz</option></select>
  <label title="Nur Python-Export: Punkt neben Städten und Bergen, in Schriftfarbe ohne Umrandung">Punkte</label><input id="dots" type="checkbox">
  <label>Label-Zoom</label><input id="lz" value="6" type="number" min="0" max="15" step="0.5" placeholder="wie Ansicht" title="Feste Zoomstufe für Städte/Grenzen (leer = aktuelle Ansicht)">
  <label>Region W,S,O,N</label><span><input id="w" type="number" step="0.01" style="width:52px"> <input id="s" type="number" step="0.01" style="width:52px"> <input id="e" type="number" step="0.01" style="width:52px"> <input id="n" type="number" step="0.01" style="width:52px"></span>
  <button id="fromview">Region aus Ansicht übernehmen</button>
  <button id="draw">Rechteck in Karte zeichnen</button>
  <label>Führende Seite</label><span><select id="fixedSide"><option value="width">Breite</option><option value="height">Höhe</option></select></span>
  <label>Breite cm</label><input id="widthCm" type="number" value="100" min="5" step="1">
  <label>Höhe cm</label><input id="heightCm" type="number" min="5" step="1" placeholder="automatisch">
  <label>Verhältnis B:H</label><input id="ratio" type="number" min="0.0001" step="0.0001" placeholder="automatisch">
  <label>Papier</label><select id="paper"><option>A4</option><option>A3</option><option>A2</option><option>A1</option><option>A0</option><option>B0</option><option value="full">Volles Bild (ein Blatt)</option></select>
  <label>DPI</label><input id="dpi" type="number" value="600" min="50" max="1200" step="50">
  <label title="Nur Python-PDF: maximale Größe einer Rechen-Kachel; die fertige PDF bleibt ein großes Blatt">Rechen-Kachel cm</label><input id="tilemm" type="number" value="50" min="0" max="100" step="5">
  <label>Schrift pt</label><input id="pt" type="number" value="5" min="4" max="72" step="1" title="Städtenamen auf Papier; Ländernamen proportional größer">
  <label title="PDF: eine Datei, eine Seite pro Blatt im Papierformat (JPEG-komprimiert, Qualität 95)">Format</label><select id="fmt"><option value="png">PNG (je Blatt eine Datei)</option><option value="jpg">JPG (je Blatt eine Datei, Qualität 95)</option><option value="pdf">PDF (eine Datei)</option></select>
  <button id="export">Exportieren</button>
  <button id="pyexport" title="Ein Bild in voller Größe ohne Blattgrenze, Text und Linien als Vektor (PDF). Braucht: py poster.py --serve und die Seite über http://localhost:8000">Mit Python exportieren</button>
  <div id="status"></div>
  <progress id="prog" style="grid-column:1/3;width:100%;display:none"></progress>
</div>
<script>
const BASE = { // url, attribution, maxzoom (deeper requests would 404 → blank patches)
  sat:  ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 'Esri', 19],
  topo: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', 'Esri, HERE, Garmin, FAO, NOAA, USGS', 19], // OpenTopoMap was throttled → hour-long exports
  osm:  ['https://tile.openstreetmap.org/{z}/{x}/{y}.png', '© OpenStreetMap', 19],
};
const $ = id => document.getElementById(id);
const PAPER = { A4: [210, 297], A3: [297, 420], A2: [420, 594], A1: [594, 841], A0: [841, 1189], B0: [1000, 1414] }; // mm
const NE = 'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson';
const status = t => $('status').textContent = t;
const R = Math.PI / 180, mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * R / 2)), invMercY = y => (2 * Math.atan(Math.exp(y)) - Math.PI / 2) / R; // lat° ↔ Mercator y

// --- Hillshade: hs://z/x/y?zf=..&az=..&alt=..&str=..  → PNG (black/white with alpha) ---
maplibregl.addProtocol('hs', async (params) => {
  const m = params.url.match(/^hs:\/\/(\d+)\/(\d+)\/(\d+)\?zf=([\d.]+)&az=([\d.]+)&alt=([\d.]+)&str=([\d.]+)&gl=([\d.]+)/);
  const [z, x, y] = [m[1], m[2], m[3]].map(Number);
  const zf = +m[4], az = +m[5], alt = +m[6], str = +m[7], gl = +m[8];
  const img = await createImageBitmap(await (await fetch(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`)).blob());
  const N = 256, c = new OffscreenCanvas(N, N), ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const px = ctx.getImageData(0, 0, N, N), d = px.data;
  const h = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) h[i] = d[i * 4] * 256 + d[i * 4 + 1] + d[i * 4 + 2] / 256 - 32768;
  // cell size in meters at this tile's latitude
  const lat = Math.atan(Math.sinh(Math.PI - 2 * Math.PI * (y + 0.5) / 2 ** z));
  const cell = 40075016.686 * Math.cos(lat) / (N * 2 ** z), q = 1 / (8 * cell);
  const zen = (90 - alt) * R, azm = ((360 - az + 90) % 360) * R;
  const cz = Math.cos(zen), sz = Math.sin(zen), ca = Math.cos(azm), sa = Math.sin(azm);
  const H = (r, col) => h[Math.min(N - 1, Math.max(0, r)) * N + Math.min(N - 1, Math.max(0, col))];
  // ponytail: edges clamp within tile → faint seams between tiles; fetch neighbours if it bothers you
  for (let r = 0; r < N; r++) for (let col = 0; col < N; col++) {
    const a = H(r-1,col-1), b = H(r-1,col), cc = H(r-1,col+1), dd = H(r,col-1), f = H(r,col+1), g = H(r+1,col-1), hh = H(r+1,col), i = H(r+1,col+1);
    const dx = ((cc + 2*f + i) - (a + 2*dd + g)) * q;
    const dy = ((g + 2*hh + i) - (a + 2*b + cc)) * q;
    // Lambert without per-pixel trig: = cz·cos(slope) + sz·sin(slope)·cos(azm − aspect) with slope = atan(zf·|∇h|), aspect = atan2(dy, −dx)
    const s = (cz + sz * zf * (dy * sa - dx * ca)) / Math.sqrt(1 + zf * zf * (dx * dx + dy * dy)); // -1..1
    // flat ground gives s = cz -> treat that as neutral, so plains stay untouched
    const o = (r * N + col) * 4, lit = s > cz;
    d[o] = d[o+1] = d[o+2] = lit ? 255 : 0;
    const alpha = lit ? (s - cz) / (1 - cz) * gl : (cz - s) / cz; // highlights damped vs. shadows (gl = "Glanzlichter"; low = matte)
    d[o+3] = Math.round(Math.min(1, Math.max(0, alpha)) * 255 * str);
  }
  ctx.putImageData(px, 0, 0);
  return { data: await (await c.convertToBlob()).arrayBuffer() };
});

const map = new maplibregl.Map({
  container: 'map', center: [10, 47], zoom: 5, maxPitch: 0, dragRotate: false,
  preserveDrawingBuffer: true, attributionControl: { compact: false },
  maxCanvasSize: [16384, 16384], // default 4096 silently clamps large exports
  style: { version: 8, projection: { type: 'mercator' }, glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf', sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#fff' } }] },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
// --- Equal Earth (Šavrič/Patterson/Jenny 2018): Mercator-Pixel → flächentreue Karte, fester Mittelmeridian ---
const EE = (() => {
  const A1 = 1.340264, A2 = -0.081106, A3 = 0.000893, A4 = 0.003796, M = Math.sqrt(3) / 2;
  const fwd = (lon, lat) => { const l = Math.asin(M * Math.sin(lat)), l2 = l * l, l6 = l2 * l2 * l2;
    return [lon * Math.cos(l) / (M * (A1 + 3 * A2 * l2 + l6 * (7 * A3 + 9 * A4 * l2))), l * (A1 + A2 * l2 + l6 * (A3 + A4 * l2))]; };
  const invY = y => { let l = y, l2 = l * l, l6 = l2 * l2 * l2; // Newton for theta
    for (let i = 0; i < 12; i++) { const d = (l * (A1 + A2 * l2 + l6 * (A3 + A4 * l2)) - y) / (A1 + 3 * A2 * l2 + l6 * (7 * A3 + 9 * A4 * l2)); l -= d; l2 = l * l; l6 = l2 * l2 * l2; if (Math.abs(d) < 1e-9) break; }
    return l; };
  const lonF = l => { const l2 = l * l, l6 = l2 * l2 * l2; return M * (A1 + 3 * A2 * l2 + l6 * (7 * A3 + 9 * A4 * l2)) / Math.cos(l); }; // lon = x·lonF(θ): grows with |θ|
  // output pixel grid for bounds [w,s,e,n] (deg), outW px wide, central meridian lon0deg (default: centre of bounds)
  const frame = ([w, s, e, n], outW, lon0deg = (w + e) / 2) => {
    const lon0 = lon0deg * R, eq = Math.min(Math.max(0, s), n);
    const pts = [[w, s], [w, n], [e, s], [e, n], [w, eq], [e, eq]].map(([a, b]) => fwd(a * R - lon0, b * R)), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x0 = Math.min(...xs), k = outW / (Math.max(...xs) - x0), y1 = Math.max(...ys);
    return { x0, y1, k, lon0, W: outW, H: Math.round((y1 - Math.min(...ys)) * k) };
  };
  // Mercator region [w,s,e,n] that feeds output window X,Y,W,H of frame fr, clipped to bounds (may come out empty/inverted)
  const srcBounds = (fr, X, Y, W, H, [w, s, e, n]) => {
    const ls = [Y, Math.min(Y + H, fr.H)].map(y => invY(fr.y1 - y / fr.k)), lats = ls.map(l => Math.asin(Math.sin(l) / M) / R);
    const fs = ls.map(lonF); if (ls[0] * ls[1] < 0) fs.push(lonF(0)); // lonF monotonic in |θ| → extremes at the edge rows or the equator
    const lons = []; for (const f of fs) for (const x of [X, X + W]) lons.push(((fr.x0 + x / fr.k) * f + fr.lon0) / R);
    return [Math.max(w, Math.min(...lons)), Math.max(s, Math.min(...lats)), Math.min(e, Math.max(...lons)), Math.min(n, Math.max(...lats))];
  };
  // warp src canvas (Mercator, exactly covering [w,s,e,n]) into output window X,Y,W,H of frame fr → canvas W×H, transparent where no source
  const warp = (src, [w, s, e, n], fr, X, Y, W, H) => {
    const sw = src.width, sh = src.height, sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
    const g = sc.getContext('2d'); g.drawImage(src, 0, 0);
    const sd = g.getImageData(0, 0, sw, sh).data, od = new Uint8ClampedArray(W * H * 4), my0 = mercY(n), mys = my0 - mercY(s);
    for (let y = 0; y < H; y++) {
      const l = invY(fr.y1 - (Y + y + 0.5) / fr.k), lat = Math.asin(Math.sin(l) / M) / R, f = lonF(l);
      const sy = Math.floor((my0 - mercY(lat)) / mys * sh); if (!(sy >= 0 && sy < sh)) continue; // also skips NaN rows beyond the frame
      for (let x = 0; x < W; x++) {
        const lon = ((fr.x0 + (X + x + 0.5) / fr.k) * f + fr.lon0) / R, sx = Math.floor((lon - w) / (e - w) * sw);
        if (sx < 0 || sx >= sw) continue;
        const si = (sy * sw + sx) * 4, oi = (y * W + x) * 4;
        od[oi] = sd[si]; od[oi + 1] = sd[si + 1]; od[oi + 2] = sd[si + 2]; od[oi + 3] = sd[si + 3];
      }
    }
    const out = document.createElement('canvas'); out.width = W; out.height = H; out.getContext('2d').putImageData(new ImageData(od, W, H), 0, 0);
    return out;
  };
  // output pixel <-> lon/lat (deg) of frame fr: mouse picking + selection box in the preview
  const unproject = (fr, ox, oy) => { const l = invY(fr.y1 - oy / fr.k), la = Math.asin(Math.sin(l) / M), lon = ((fr.x0 + ox / fr.k) * lonF(l) + fr.lon0) / R;
    return isFinite(la) && Math.abs(lon - fr.lon0 / R) <= 180 ? [lon, la / R] : null; };
  const project = (fr, lon, lat) => { const [x, y] = fwd(lon * R - fr.lon0, lat * R); return [(x - fr.x0) * fr.k, (fr.y1 - y) * fr.k]; };
  return { frame, srcBounds, warp, unproject, project };
})();
// --- Robinson + Lambert-Azimutal (Kugel): gleiche Schnittstelle wie EE, aber generisch ueber Vorwaerts-/Rueckwaertsformel.
// Ausgabepixel -> inv -> lon/lat -> Mercator-Quellpixel. ponytail: srcBounds tastet ein 33x33-Raster ab (+2 % Rand), Robinson ist linear zwischen den Tabellenwerten
const PJ = (() => {
  const PLEN = [1, .9986, .9954, .99, .9822, .973, .96, .9427, .9216, .8962, .8679, .835, .7986, .7597, .7186, .6732, .6213, .5722, .5322]; // Robinson-Tabelle, 5°-Schritte
  const PDFE = [0, .062, .124, .186, .248, .31, .372, .434, .4958, .5571, .6176, .6769, .7346, .7903, .8435, .8936, .9394, .9761, 1];
  const tab = (T, t) => { const i = Math.min(17, Math.floor(t)); return T[i] + (T[i + 1] - T[i]) * (t - i); }; // t = |lat| / 5°
  const wrap = (deg, c) => deg - 360 * Math.round((deg - c) / 360); // in [c-180, c+180]
  const mk = (kind, lat0) => {
    if (kind === 'rob') return {
      fwd: (l, p) => { const t = Math.abs(p) / (5 * R); return [.8487 * tab(PLEN, t) * l, Math.sign(p) * 1.3523 * tab(PDFE, t)]; },
      inv: (x, y) => {
        const v = Math.abs(y) / 1.3523; if (v > 1) return null;
        let i = 0; while (i < 17 && PDFE[i + 1] < v) i++;
        const t = i + (v - PDFE[i]) / (PDFE[i + 1] - PDFE[i]), l = x / (.8487 * tab(PLEN, t));
        return Math.abs(l) > Math.PI ? null : [l, Math.sign(y) * t * 5 * R];
      } };
    const s0 = Math.sin(lat0), c0 = Math.cos(lat0); // Lambert-Azimutal (flaechentreu)
    return {
      fwd: (l, p) => { const sp = Math.sin(p), cp = Math.cos(p), cl = Math.cos(l), d = 1 + s0 * sp + c0 * cp * cl; return d < 1e-9 ? [NaN, NaN] : [Math.sqrt(2 / d) * cp * Math.sin(l), Math.sqrt(2 / d) * (c0 * sp - s0 * cp * cl)]; },
      inv: (x, y) => {
        const r = Math.hypot(x, y); if (r > 2) return null; if (r < 1e-12) return [0, lat0];
        const c = 2 * Math.asin(r / 2), sc = Math.sin(c), cc = Math.cos(c);
        return [Math.atan2(x * sc, r * c0 * cc - y * s0 * sc), Math.asin(Math.max(-1, Math.min(1, cc * s0 + y * sc * c0 / r)))];
      } };
  };
  return kind => {
    // output pixel grid for bounds [w,s,e,n] (deg), outW px wide; lon0/lat0 = projection centre (default: centre of bounds). kdeg = Mercator source px per degree lon that keeps full detail
    const frame = ([w, s, e, n], outW, lon0deg = (w + e) / 2, lat0deg = (s + n) / 2) => {
      const p = mk(kind, lat0deg * R), N = 40; let xa = Infinity, xb = -Infinity, ya = Infinity, yb = -Infinity;
      for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
        const [x, y] = p.fwd((wrap(w + (e - w) * i / N, lon0deg) - lon0deg) * R, (s + (n - s) * j / N) * R);
        if (isFinite(x) && isFinite(y)) { xa = Math.min(xa, x); xb = Math.max(xb, x); ya = Math.min(ya, y); yb = Math.max(yb, y); }
      }
      const k = outW / (xb - xa), m = s <= 0 && n >= 0 ? 0 : Math.min(Math.abs(s), Math.abs(n));
      return { x0: xa, y1: yb, k, lon0deg, W: outW, H: Math.round((yb - ya) * k), p, kdeg: k * R * Math.cos(m * R) };
    };
    const srcBounds = (fr, X, Y, W, H, [w, s, e, n]) => {
      const cw = (w + e) / 2, N = 32; let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
      for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
        const q = fr.p.inv(fr.x0 + (X + W * i / N) / fr.k, fr.y1 - (Y + H * j / N) / fr.k); if (!q) continue;
        const lon = wrap(fr.lon0deg + q[0] / R, cw), lat = q[1] / R;
        a = Math.min(a, lon); c = Math.max(c, lon); b = Math.min(b, lat); d = Math.max(d, lat);
      }
      if (a === Infinity) return [1, 1, 0, 0]; // window entirely outside the projection → callers skip it
      const mx = (c - a) * .02 + .01, my = (d - b) * .02 + .01;
      return [Math.max(w, a - mx), Math.max(s, b - my), Math.min(e, c + mx), Math.min(n, d + my)];
    };
    // warp src canvas (Mercator, exactly covering [w,s,e,n]) into output window X,Y,W,H of frame fr → canvas W×H, transparent where no source
    const warp = (src, [w, s, e, n], fr, X, Y, W, H) => {
      const sw = src.width, sh = src.height, sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
      const g = sc.getContext('2d'); g.drawImage(src, 0, 0);
      const sd = g.getImageData(0, 0, sw, sh).data, od = new Uint8ClampedArray(W * H * 4), my0 = mercY(n), mys = my0 - mercY(s), cw = (w + e) / 2;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const q = fr.p.inv(fr.x0 + (X + x + .5) / fr.k, fr.y1 - (Y + y + .5) / fr.k); if (!q) continue;
        const sy = Math.floor((my0 - mercY(q[1] / R)) / mys * sh), sx = Math.floor((wrap(fr.lon0deg + q[0] / R, cw) - w) / (e - w) * sw);
        if (!(sy >= 0 && sy < sh) || sx < 0 || sx >= sw) continue; // NaN (pole) fails the range test
        const si = (sy * sw + sx) * 4, oi = (y * W + x) * 4;
        od[oi] = sd[si]; od[oi + 1] = sd[si + 1]; od[oi + 2] = sd[si + 2]; od[oi + 3] = sd[si + 3];
      }
      const out = document.createElement('canvas'); out.width = W; out.height = H; out.getContext('2d').putImageData(new ImageData(od, W, H), 0, 0);
      return out;
    };
    const unproject = (fr, ox, oy) => { const q = fr.p.inv(fr.x0 + ox / fr.k, fr.y1 - oy / fr.k); return q ? [wrap(fr.lon0deg + q[0] / R, 0), q[1] / R] : null; };
    const project = (fr, lon, lat) => { const [x, y] = fr.p.fwd((wrap(lon, fr.lon0deg) - fr.lon0deg) * R, lat * R); return [(x - fr.x0) * fr.k, (fr.y1 - y) * fr.k]; };
    return { frame, srcBounds, warp, unproject, project };
  };
})();
const PR = () => { const v = $('proj').value; return v === 'ee' || v === 'eew' ? EE : PJ(v === 'laea' ? 'laea' : 'rob'); }; // active projection module

  const add = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const obj = (id, head, stream) => { offs[id] = len; add(`${id} 0 obj\n<<${head}${stream ? `/Length ${stream.length}` : ''}>>\n`); if (stream) { add('stream\n'); add(stream); add('\nendstream\n'); } add('endobj\n'); };

  pages.forEach((p, i) => {
    const id = 3 + 3 * i, pw = (p.w * 72 / dpi).toFixed(2), ph = (p.h * 72 / dpi).toFixed(2);
    obj(id, `/Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</I ${id + 2} 0 R>>>>/Contents ${id + 1} 0 R`);
    obj(id + 1, '', enc.encode(`q ${pw} 0 0 ${ph} 0 0 cm /I Do Q`));
    obj(id + 2, `/Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode`, p.jpg);
  });
  const N = 2 + 3 * pages.length, x = len; add(`xref\n0 ${N + 1}\n0000000000 65535 f \n`);
  for (let id = 1; id <= N; id++) add(`${String(offs[id]).padStart(10, '0')} 00000 n \n`);
  add(`trailer\n<</Size ${N + 1}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}

$('pyexport').onclick = async () => {
  const v = $('proj').value, box = ['w', 's', 'e', 'n'].map(k => $(k).value), useBox = box.every(x => x !== '');
  if (location.protocol !== 'http:') return status('Python-Export: zuerst py poster.py --serve starten und die Seite über http://localhost:8000 öffnen');

  if (v === 'globe') return status('Python-Export: Globus wird nicht unterstützt');
